<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gullhaven Fishers</title>
<link rel="icon" href="collection.png">
<style>
  @font-face { font-family: Pixelify; src: url("pixelify_sans.woff2") format("woff2"); }
  @font-face { font-family: Jersey; src: url("jersey_10.woff2") format("woff2"); }
  :root { --sea: #0d1b2a; --deep: #08121d; --card: #13263a; --cream: #f6ecd2; --gold: #ffd24d; --sky: #8fd3ff; --dim: #8aa0b4; --good: #7fe3a0; --bad: #ff8a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(var(--sea), var(--deep)); color: var(--cream); font: 18px/1.45 Pixelify, system-ui, sans-serif; font-variant-ligatures: none; font-feature-settings: "liga" 0, "clig" 0; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  button, h1 { font-variant-ligatures: none; }
  h1 { font: 56px/1 Jersey, Pixelify, sans-serif; color: var(--gold); margin: 0; letter-spacing: 1px; }
  .net { color: var(--dim); font-size: 15px; }
  button { font: inherit; border: 3px solid #000; background: var(--gold); color: #1a1205; padding: 10px 18px; cursor: pointer; box-shadow: 0 4px 0 #8a6a12; }
  button:disabled { background: #5b6b7a; color: #d6dde4; box-shadow: 0 4px 0 #2e3a46; cursor: default; }
  button.ghost { background: var(--card); color: var(--cream); box-shadow: 0 4px 0 #050b12; }
  .hero { display: grid; grid-template-columns: 220px 1fr; gap: 24px; margin-top: 28px; align-items: center; }
  .hero img { width: 100%; image-rendering: pixelated; border: 4px solid #000; }
  .meter { height: 18px; background: var(--card); border: 3px solid #000; margin: 10px 0 4px; }
  #bar { height: 100%; width: 0; background: linear-gradient(90deg, #9945ff, #14f195); }
  #status { min-height: 1.5em; margin-top: 14px; color: var(--sky); }
  #status.good { color: var(--good); } #status.bad { color: var(--bad); }
  #minted { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 24px; }
  figure { margin: 0; background: var(--card); border: 3px solid #000; padding: 6px; }
  figure img { width: 100%; image-rendering: pixelated; display: block; }
  figcaption { font-size: 15px; text-align: center; margin-top: 4px; }
  p.small { color: var(--dim); font-size: 15px; }
  @media (max-width: 560px) { .hero { grid-template-columns: 1fr; } .hero img { max-width: 240px; } h1 { font-size: 44px; } }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Gullhaven Fishers</h1><div class="net" id="network"></div></div>
    <button class="ghost" id="connect">Connect wallet</button>
  </header>
  <section class="hero">
    <img src="collection.png" alt="A Gullhaven Fisher">
    <div>
      <p>3,333 pixel fishers for Gullhaven, the cosy fishing town. Each one is a Harbour Licence in the game: send your Fishers out to sea, bring the catch home and sell Shells for $GULL.</p>
      <div id="price"></div>
      <div class="meter"><div id="bar"></div></div>
      <div id="count">…</div>
      <p><button id="mint" disabled>Connect a wallet to mint</button></p>
      <div id="status"></div>
    </div>
  </section>
  <section id="minted"></section>
  <p class="small">Every Fisher is a Metaplex Core NFT with a 5% creator royalty. Mint order is random.</p>
</main>
<script src="mint.js"></script>
</body>
</html>
