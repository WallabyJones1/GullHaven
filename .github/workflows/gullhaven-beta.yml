# Builds the Godot game (godot/ on the hd2d branch) for Windows, macOS and Linux, and
# shares it.
#
# - Every push to hd2d that touches godot/ builds all three, as a downloadable artifact on
#   the run's page (Actions tab). Nothing is published.
# - Pushing a tag that starts with "beta-" (for example beta-0.5), or publishing a release
#   on GitHub, also:
#     1. attaches the three zips to a GitHub pre-release with that name;
#     2. uploads them to itch.io, if the repo has a BUTLER_API_KEY secret and an ITCH_GAME
#        variable (for example wallabyjones/gullhaven) -- see godot/SHARING.md;
#     3. uploads them to Steam, if the repo has a STEAM_APP_ID variable plus STEAM_USERNAME
#        and STEAM_CONFIG_VDF secrets -- also in godot/SHARING.md.
# - You can also run it by hand from the Actions tab (Run workflow, branch hd2d).
name: Gullhaven beta builds

on:
  push:
    branches: [hd2d]
    paths: ["godot/**", ".github/workflows/gullhaven-beta.yml"]
    tags: ["beta-*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6.1"
  GODOT_STATUS: "stable"

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.name.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Name this build
        id: name
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Fetch Godot and its export templates
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${V}_linux.x86_64" godot-bin
          chmod +x godot-bin
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$DEST"
          unzip -q templates.tpz
          mv templates/* "$DEST/"

      - name: Import the project
        run: ./godot-bin --headless --path godot --import || ./godot-bin --headless --path godot --editor --quit-after 600

      - name: Check every script with Godot
        run: |
          : > godot-check.log
          for f in godot/scripts/*.gd; do
            ./godot-bin --headless --path godot --check-only --script "res://scripts/$(basename "$f")" >> godot-check.log 2>&1 || echo "FAILED: $f" >> godot-check.log
          done
          if grep -E "ERROR|FAILED|Parse Error" godot-check.log > godot-problems.log; then
            echo "## Script problems" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/    /' godot-problems.log >> "$GITHUB_STEP_SUMMARY"
            cat godot-problems.log
          else
            echo "All scripts load cleanly."
          fi

      - name: Play through the game with no one at the controls (smoke test)
        run: |
          timeout 600 ./godot-bin --headless --fixed-fps 60 --path godot -- --smoke > smoke.log 2>&1 || true
          echo "$(grep -c 'SMOKE CHECK ok' smoke.log) checks passed"
          # (headless Godot can't name keys from the keyboard layout: that noise is dropped)
          grep -v -E "Not supported by this display server|keyboard_get_keycode_from_physical" smoke.log > smoke-clean.log || true
          grep -B1 -E "SMOKE CHECK FAIL|SCRIPT ERROR|ERROR|WARNING|   at: |SMOKE DONE" smoke-clean.log | head -400 || true
          if grep -q "SMOKE DONE" smoke.log; then echo "Smoke test finished."; else echo "Smoke test did not finish."; fi
          if grep -E "SMOKE CHECK FAIL|SCRIPT ERROR|ERROR" smoke-clean.log > smoke-problems.log; then
            echo "## Smoke test problems" >> "$GITHUB_STEP_SUMMARY"
            head -100 smoke-problems.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-test-logs
          path: |
            godot-check.log
            smoke.log

      - name: Export Windows, macOS and Linux
        run: |
          mkdir -p godot/build/windows godot/build/mac godot/build/linux
          ./godot-bin --headless --path godot --export-release "Windows Desktop" build/windows/Gullhaven.exe
          ./godot-bin --headless --path godot --export-release "macOS" build/mac/Gullhaven.zip
          ./godot-bin --headless --path godot --export-release "Linux" build/linux/Gullhaven.x86_64
          test -s godot/build/windows/Gullhaven.exe
          test -s godot/build/mac/Gullhaven.zip
          test -s godot/build/linux/Gullhaven.x86_64

      - name: Package
        run: |
          NAME="${{ steps.name.outputs.name }}"
          cd godot/build
          cp ../BETA.md windows/README.md
          cp ../BETA.md linux/README.md
          (cd windows && zip -qr "../Gullhaven-${NAME}-windows.zip" .)
          (cd linux && chmod +x Gullhaven.x86_64 && zip -qr "../Gullhaven-${NAME}-linux.zip" .)
          mv mac/Gullhaven.zip "Gullhaven-${NAME}-mac.zip"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: gullhaven-builds
          path: godot/build/*.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/beta-') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: godot/build/*.zip
          prerelease: true
          body_path: godot/BETA.md

  itch:
    needs: export
    if: (startsWith(github.ref, 'refs/tags/beta-') || github.event_name == 'release') && vars.ITCH_GAME != ''
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gullhaven-builds
          path: builds

      - name: Upload to itch.io
        run: |
          if [ -z "$BUTLER_API_KEY" ]; then echo "No BUTLER_API_KEY secret yet: skipping itch.io"; exit 0; fi
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          NAME="${{ needs.export.outputs.name }}"
          ./butler push "builds/Gullhaven-${NAME}-windows.zip" "${{ vars.ITCH_GAME }}:windows" --userversion "$NAME"
          ./butler push "builds/Gullhaven-${NAME}-mac.zip" "${{ vars.ITCH_GAME }}:mac" --userversion "$NAME"
          ./butler push "builds/Gullhaven-${NAME}-linux.zip" "${{ vars.ITCH_GAME }}:linux" --userversion "$NAME"

  steam:
    needs: export
    if: (startsWith(github.ref, 'refs/tags/beta-') || github.event_name == 'release') && vars.STEAM_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gullhaven-builds
          path: builds

      - name: Unpack for Steam's depots
        run: |
          NAME="${{ needs.export.outputs.name }}"
          mkdir -p steam/windows steam/mac steam/linux
          unzip -q "builds/Gullhaven-${NAME}-windows.zip" -d steam/windows
          unzip -q "builds/Gullhaven-${NAME}-mac.zip" -d steam/mac
          unzip -q "builds/Gullhaven-${NAME}-linux.zip" -d steam/linux
          chmod +x steam/linux/Gullhaven.x86_64

      - uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APP_ID }}
          buildDescription: ${{ needs.export.outputs.name }}
          rootPath: steam
          depot1Path: windows
          depot2Path: mac
          depot3Path: linux
          releaseBranch: ${{ vars.STEAM_BRANCH || 'beta' }}
