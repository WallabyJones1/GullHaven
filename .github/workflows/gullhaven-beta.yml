# Builds downloadable beta copies of the Godot game (godot/ on the hd2d branch) for
# Windows, macOS and Linux.
#
# Ways to run it:
# - Push a tag that starts with "beta-" (for example beta-0.4). The builds are attached to a
#   GitHub pre-release with that name, ready to share.
# - Publish a release on GitHub (Releases > Draft a new release, target hd2d). The builds
#   are added to it.
# - Run it by hand from the Actions tab (Run workflow, branch hd2d). The builds appear as
#   a downloadable artifact on the run's page.
name: Gullhaven beta builds

on:
  push:
    tags: ["beta-*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.6"
  GODOT_STATUS: "stable"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Godot and its export templates
        run: |
          V="${GODOT_VERSION}-${GODOT_STATUS}"
          BASE="https://github.com/godotengine/godot/releases/download/${V}"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${V}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${V}_export_templates.tpz"
          unzip -q godot.zip
          mv "Godot_v${V}_linux.x86_64" godot-bin
          chmod +x godot-bin
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$DEST"
          unzip -q templates.tpz
          mv templates/* "$DEST/"

      - name: Import the project
        run: ./godot-bin --headless --path godot --import || ./godot-bin --headless --path godot --editor --quit-after 600

      - name: Export Windows, macOS and Linux
        run: |
          mkdir -p godot/build/windows godot/build/mac godot/build/linux
          ./godot-bin --headless --path godot --export-release "Windows Desktop" build/windows/Gullhaven.exe
          ./godot-bin --headless --path godot --export-release "macOS" build/mac/Gullhaven.zip
          ./godot-bin --headless --path godot --export-release "Linux" build/linux/Gullhaven.x86_64

      - name: Package
        run: |
          NAME="${GITHUB_REF_NAME//\//-}"
          cd godot/build
          cp ../BETA.md windows/README.md
          cp ../BETA.md linux/README.md
          (cd windows && zip -qr "../Gullhaven-${NAME}-windows.zip" .)
          (cd linux && chmod +x Gullhaven.x86_64 && zip -qr "../Gullhaven-${NAME}-linux.zip" .)
          mv mac/Gullhaven.zip "Gullhaven-${NAME}-mac.zip"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: gullhaven-beta
          path: godot/build/*.zip

      - name: Attach to the release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: godot/build/*.zip
          prerelease: true
          body_path: godot/BETA.md
